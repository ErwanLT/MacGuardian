name: Release

# Publier une version : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publication
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: scripts/test.sh

      - name: Construction de la release (binaire universel)
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/make-release.sh "${TAG#v}" "$BUILD_NUMBER"

      - name: Publication sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          sed "s/{{VERSION}}/$version/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* \
            --title "MacGuardian $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${prerelease[@]}"
